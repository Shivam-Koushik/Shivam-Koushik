<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 270" width="320" height="270" role="img">
<defs></defs>
<style>
.r{opacity:0;animation:rise .8s cubic-bezier(.2,.7,.2,1) forwards}
.f{animation:float 5s ease-in-out infinite}
.f2{animation:float 7s ease-in-out infinite}
.dot{transform-box:fill-box;transform-origin:center;animation:pulse 1.8s ease-out infinite}
.cur{animation:blink 1s steps(1) infinite}
.grow{transform-box:fill-box;transform-origin:left center;transform:scaleX(0);animation:grow .9s .4s cubic-bezier(.2,.7,.2,1) forwards}
.growy{transform-box:fill-box;transform-origin:top center;transform:scaleY(0);animation:growy .7s .3s cubic-bezier(.2,.7,.2,1) forwards}
.nudge{animation:nudge 2.2s ease-in-out infinite}
.dash{animation:dash 1.6s linear infinite}
.card{transition:fill .2s}
.card:hover{fill:#F8F6F1}
@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes pulse{0%{transform:scale(1);opacity:1}100%{transform:scale(2.6);opacity:0}}
@keyframes blink{50%{opacity:0}}
@keyframes grow{to{transform:scaleX(1)}}
@keyframes growy{to{transform:scaleY(1)}}
@keyframes nudge{0%,100%{transform:translateX(0)}50%{transform:translateX(5px)}}
@keyframes dash{to{stroke-dashoffset:-32}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.r{opacity:1!important}.grow{transform:none!important}.growy{transform:none!important}}
</style>
<title>Currently exploring</title>
<rect x="1.5" y="1.5" width="317" height="267" rx="22" fill="#2F4B7C" stroke="#111111" stroke-width="2.5"/>
<circle class="dot" cx="38" cy="42" r="5" fill="#B5C29E"/><circle cx="38" cy="42" r="5" fill="#B5C29E"/>
<text class="r" x="52" y="47" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="12" letter-spacing="2.5" fill="#B5C29E" font-weight="700">NOW</text>
<text class="r" x="32" y="94" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="25" font-weight="800" fill="#F8F6F1" letter-spacing="-.5" style="animation-delay:.2s">Exploring</text>
<text class="r" x="32" y="130" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="14" font-weight="700" fill="#B5C29E" style="animation-delay:0.50s">▸</text><text class="r" x="54" y="130" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="14.5" fill="#F8F6F1" font-weight="600" style="animation-delay:0.50s">Backend development with</text><text class="r" x="54" y="150" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="14.5" fill="#E3E6EE" style="animation-delay:0.55s">Node.js, Express &amp; MongoDB</text><text class="r" x="32" y="182" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="14" font-weight="700" fill="#B5C29E" style="animation-delay:0.68s">▸</text><text class="r" x="54" y="182" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="14.5" fill="#F8F6F1" font-weight="600" style="animation-delay:0.68s">New technologies, one</text><text class="r" x="54" y="202" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="14.5" fill="#E3E6EE" style="animation-delay:0.73s">build at a time</text><text class="r" x="32" y="234" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="14" font-weight="700" fill="#B5C29E" style="animation-delay:0.86s">▸</text><text class="r" x="54" y="234" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="14.5" fill="#F8F6F1" font-weight="600" style="animation-delay:0.86s">Challenging projects and</text><text class="r" x="54" y="254" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="14.5" fill="#E3E6EE" style="animation-delay:0.91s">good collaborators</text>
</svg>
