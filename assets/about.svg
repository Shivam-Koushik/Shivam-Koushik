<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 270" width="560" height="270" role="img">
<defs></defs>
<style>
.r{opacity:0;animation:rise .8s cubic-bezier(.2,.7,.2,1) forwards}
.f{animation:float 5s ease-in-out infinite}
.f2{animation:float 7s ease-in-out infinite}
.dot{transform-box:fill-box;transform-origin:center;animation:pulse 1.8s ease-out infinite}
.cur{animation:blink 1s steps(1) infinite}
.grow{transform-box:fill-box;transform-origin:left center;transform:scaleX(0);animation:grow .9s .4s cubic-bezier(.2,.7,.2,1) forwards}
.growy{transform-box:fill-box;transform-origin:top center;transform:scaleY(0);animation:growy .7s .3s cubic-bezier(.2,.7,.2,1) forwards}
.nudge{animation:nudge 2.2s ease-in-out infinite}
.dash{animation:dash 1.6s linear infinite}
.card{transition:fill .2s}
.card:hover{fill:#FFFFFF}
@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes pulse{0%{transform:scale(1);opacity:1}100%{transform:scale(2.6);opacity:0}}
@keyframes blink{50%{opacity:0}}
@keyframes grow{to{transform:scaleX(1)}}
@keyframes growy{to{transform:scaleY(1)}}
@keyframes nudge{0%,100%{transform:translateX(0)}50%{transform:translateX(5px)}}
@keyframes dash{to{stroke-dashoffset:-32}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.r{opacity:1!important}.grow{transform:none!important}.growy{transform:none!important}}
</style>
<title>About</title>
<rect class="card" x="1.5" y="1.5" width="557" height="267" rx="22" fill="#F0EEE9" stroke="#111111" stroke-width="2.5"/>
<text class="r" x="32" y="46" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="12" letter-spacing="2.5" fill="#2F4BFF" font-weight="700">ABOUT</text>
<rect class="grow" x="32" y="55" width="54" height="4" rx="2" fill="#2F4BFF"/>
<text class="r" x="32" y="94" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="25" font-weight="800" fill="#111111" letter-spacing="-.5" style="animation-delay:.2s">Software developer, going deep</text>
<text class="r" x="32" y="123" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="25" font-weight="800" fill="#111111" letter-spacing="-.5" style="animation-delay:.3s">on the server side.</text>
<text class="r" x="32" y="150" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="15" fill="#333" style="animation-delay:0.50s">I like the moment an idea turns into something that</text><text class="r" x="32" y="173" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="15" fill="#333" style="animation-delay:0.62s">actually runs, and the stretch before it, when I don't</text><text class="r" x="32" y="196" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="15" fill="#333" style="animation-delay:0.74s">yet know how and have to find out. Interesting, slightly</text><text class="r" x="32" y="219" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="15" fill="#333" style="animation-delay:0.86s">hard projects are my favourite kind. Laptop closed?</text><text class="r" x="32" y="242" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="15" fill="#333" style="animation-delay:0.98s">Usually science fiction.</text>
</svg>
